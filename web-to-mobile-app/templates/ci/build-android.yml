# Template: .github/workflows/build-android.yml
# Builds a signed release APK (for sideloading) and AAB (for Google Play) on every push to main.
# Needs repository secrets: ANDROID_KEYSTORE_BASE64 (base64 of the .jks file),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Pair it with templates/android/signing.gradle. Replace APP_NAME below.
# Check versions.md for the Node/JDK versions the current Capacitor needs.

name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check, then build signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner already has the Android SDK; this adds Gradle caching
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      # Fail fast before spending minutes on Gradle. Remove a line if the project lacks that script.
      - name: Typecheck, lint and test
        run: |
          npx tsc --noEmit
          npm run lint --if-present
          npm test --if-present

      - name: Build web app and sync Capacitor
        run: npm run build && npx cap sync android

      # Never fall back to a throwaway key: builds signed with different keys can't update each other
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to build with a throwaway key."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APP_NAME-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: APP_NAME-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
